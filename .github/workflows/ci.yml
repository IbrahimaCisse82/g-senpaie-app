# Contrôle automatique : toute modification (y compris depuis Lovable) doit garder
# les calculs de paie conformes au modèle Excel SENEXCELPAIE et au droit sénégalais.
name: CI paie

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Installation (lockfile strict)
        run: npm ci --no-audit --no-fund
      - name: Types
        run: npx tsc -p tsconfig.app.json --noEmit
      - name: Tests de paie (non-régression Excel, règles légales)
        run: npx vitest run
      - name: Build
        run: npm run build

  cloisonnement:
    # Rejoue toutes les migrations sur un Postgres vide puis vérifie qu'une entreprise ne voit,
    # ne modifie et ne rejoint jamais une autre entreprise (règles d'accès par ligne).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Migrations et test d'isolation
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: bash supabase/tests/run.sh
